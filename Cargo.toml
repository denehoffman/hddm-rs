[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
authors = ["Nathaniel Dene Hoffman <nhoffman@wm.edu>"]
edition = "2024"
homepage = "https://github.com/denehoffman/hddm-rs"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/denehoffman/hddm-rs"
rust-version = "1.88.0"

[workspace.dependencies]
anyhow = "1.0.102"
bzip2 = "0.6.1"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
gluex-core = "0.2.2"
heck = "0.5.0"
indexmap = "2.14.0"
md5 = "0.8.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
quick-xml = "0.39.2"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
thiserror = "2.0.18"

hddm = { version = "0.1.0", path = "crates/hddm" }
hddm-derive = { version = "0.1.0", path = "crates/hddm-derive" }
